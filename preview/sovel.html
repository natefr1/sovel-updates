<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sovel shell browser test</title>
<style>
:root{color-scheme:dark;font:14px "Noto Sans",system-ui,sans-serif;color:#f8f1ff;--glass:rgba(27,16,43,.52)}
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:radial-gradient(ellipse at 20% 65%,#b254a9,transparent 48%),radial-gradient(ellipse at 80% 20%,#5d3494,transparent 60%),#160e26;background-size:cover;background-position:center}
button,input{font:inherit;color:inherit}button{border:0;cursor:pointer;border-radius:9px;padding:8px 12px;background:#ffffff12;transition:background .12s,transform .15s}button:hover,button:focus-visible{background:#c798ff40;outline:1px solid #ead1ff80}input{border:1px solid #ffffff38;border-radius:9px;background:#120b2380;padding:10px}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:1px solid #e7caff55;box-shadow:inset 0 1px #ffffff40,0 16px 40px #0004;border-radius:18px}
header{position:fixed;inset:0 0 auto;height:32px;z-index:100;display:flex;align-items:center;gap:5px;padding:0 12px;border-radius:0!important}header button{padding:4px 10px;height:28px;background:transparent}#active{font-weight:700;min-width:80px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.spacer{flex:1}#clock{font-size:12px}
#dock{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:90;padding:8px;display:flex;gap:8px;height:76px;max-width:calc(100vw - 24px);overflow-x:auto;transition:width .22s cubic-bezier(.2,.8,.2,1)}#dock button{position:relative;flex:none;width:56px;height:56px;padding:5px;border-radius:14px;transition:transform .15s,background .15s}#dock button:hover{transform:translateY(-5px) scale(1.10)}#dock img{width:44px;height:44px;object-fit:contain}.running:after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:#f3dbff;bottom:-1px;left:26px}#dock .library{border-left:1px solid #ffffff45;border-radius:0 12px 12px 0;font-size:30px}
.window{position:absolute;top:100px;left:12%;width:min(750px,80vw);height:min(460px,70vh);display:flex;flex-direction:column;background:#281d3fe6;border:1px solid #ffffff60;border-radius:18px;overflow:hidden;box-shadow:0 20px 80px #0007;animation:arrive .2s ease-out;transition:opacity .16s,transform .16s}.window.minimized{opacity:0;pointer-events:none;transform:translateY(100px) scale(.8)}.window.maximized{left:0!important;top:32px!important;width:100vw;height:calc(100vh - 32px);border-radius:0}.title{height:42px;display:flex;align-items:center;gap:8px;background:#ffffff0b;padding:0 14px;user-select:none;touch-action:none}.title strong{margin:auto}.dot{width:14px;height:14px;border-radius:50%;padding:0}.close{background:#ff615c}.min{background:#ffbf44}.max{background:#35cc4b}.body{padding:24px;overflow:auto;flex:1}.body p{line-height:1.7}.body textarea{width:100%;height:140px;background:#120b2370;color:inherit;padding:12px;border-radius:12px;border:1px solid #ffffff38}.hint{color:#cbbbda;font-size:12px}
#menu{position:fixed;z-index:200;min-width:230px;padding:7px;display:none;transform-origin:top;animation:arrive .12s ease-out}#menu.open{display:block}#menu button{display:block;text-align:left;width:100%;background:transparent}#menu button:hover{background:#b184dd55}#menu hr{border:0;border-top:1px solid #ffffff22}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:14px}.grid button{min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.grid img{width:42px;height:42px;object-fit:contain}.grid span{font-size:12px}
#selection{position:fixed;inset:0;z-index:300;background:#0008;display:none;cursor:crosshair;touch-action:none}#region{position:absolute;border:2px solid #e8ceff;background:#ffffff18;display:none}#toast{position:fixed;right:20px;top:50px;z-index:400;padding:16px;display:none;max-width:340px}.previewLabel{position:fixed;left:20px;bottom:110px;color:#e9d4ff90;font-size:12px;pointer-events:none}@keyframes arrive{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<header class="glass" id="bar"><button data-menu="system" aria-label="Sovel menu">SV</button><span id="active">Desktop</span><button data-menu="file">File</button><button data-menu="view">View</button><button data-menu="window">Window</button><span class="spacer"></span><button id="jared" aria-label="JARED">✦</button><button id="shot" aria-label="Screenshot">▣</button><span id="clock"></span></header>

f2d5a5bc7cea0648c9a332/icons/128x128/com.visualstudio.code.png", "summary": "Code editing. Redefined."}, {"id": "org.gnome.Builder", "name": "Builder", "icon": "https://dl.flathub.org/media/org/gnome/Builder/18ce275bf2230a495c992e08b5fbf088/icons/128x128/org.gnome.Builder.png", "summary": "Create applications for GNOME"}, {"id": "org.godotengine.Godot", "name": "Godot Engine", "icon": "https://dl.flathub.org/media/org/godotengine/Godot.desktop/7d0473583b3a7a60927f7e289669a20c/icons/128x128/org.godotengine.Godot.desktop.png", "summary": "Easily create 2D and 3D games"}, {"id": "com.github.tchx84.Flatseal", "name": "Flatseal", "icon": "https://dl.flathub.org/media/com/github/tchx84.Flatseal/462bde383c024a52b3132ae3df79704a/icons/128x128/com.github.tchx84.Flatseal.png", "summary": "Manage Flatpak permissions"}, {"id": "com.discordapp.Discord", "name": "Discord", "icon": "https://dl.flathub.org/media/com/discordapp/Discord/34a49b5070ac91437d7f7b962e92686d/icons/128x128/com.discordapp.Discord.png", "summary": "Talk, play, hang out"}, {"id": "dev.vencord.Vesktop", "name": "Vesktop", "icon": "https://dl.flathub.org/media/dev/vencord/Vesktop/1295762b6142d0f41c4a334f40945860/icons/128x128/dev.vencord.Vesktop.png", "summary": "Customizable Discord client"}, {"id": "io.github.jeffshee.Hidamari", "name": "Hidamari", "icon": "https://dl.flathub.org/media/io/github/jeffshee.Hidamari/76183b5527e6b4ef51fe10bf18c28303/icons/128x128/io.github.jeffshee.Hidamari.png", "summary": "Video wallpaper for Linux"}]</script>
<script>
'use strict';
const $=s=>document.querySelector(s),windows=new Map();
const apps=[{id:'files',name:'Files',glyph:'📁'},{id:'settings',name:'Settings',glyph:'⚙'},{id:'store',name:'Store',glyph:'▣'},{id:'terminal',name:'Terminal',glyph:'❯'},...JSON.parse(document.getElementById('catalog').textContent).map(app=>({...app,glyph:'▧'}))];
function icon(button,app){if(app.icon){const image=document.createElement('img');image.src=app.icon;image.alt='';image.onerror=()=>{image.src='../assets/icons/generic-app.svg'};button.replaceChildren(image)}else button.textContent=app.glyph}

let pins;try{pins=JSON.parse(localStorage.getItem('sovel-pins'))||['files','settings','store']}catch{pins=['files','settings','store']}
pins=pins.filter((id,i)=>apps.some(a=>a.id===id)&&pins.indexOf(id)===i);let active=null,z=1,menuOwner='',wallpaperURL=null,dragged='';
function closeMenu(){const m=$('#menu');m.classList.remove('open');m.replaceChildren();menuOwner=''}
function menu(owner,items,x,y){if(menuOwner===owner){closeMenu();return}closeMenu();menuOwner=owner;const m=$('#menu');for(const item of items){if(!item){m.append(document.createElement('hr'));continue}const b=document.createElement('button');b.textContent=item[0];b.setAttribute('role','menuitem');b.addEventListener('click',()=>{closeMenu();item[1]()});m.append(b)}m.classList.add('open');m.style.left=Math.min(x,innerWidth-m.offsetWidth-10)+'px';m.style.top=Math.min(y,innerHeight-m.offsetHeight-10)+'px';m.querySelector('button')?.focus({preventScroll:true})}
function notify(message){$('#toast').textContent=message;$('#toast').style.display='block';clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('#toast').style.display='none',4000)}
function savePins(){localStorage.setItem('sovel-pins',JSON.stringify(pins));dock()}
function pinMenu(app,event){event.preventDefault();const i=pins.indexOf(app.id);menu('app:'+app.id,[[i<0?'Pin to Dock':'Unpin from Dock',()=>{pins=i<0?[...pins,app.id]:pins.filter(x=>x!==app.id);savePins()}],['Move Left',()=>{if(i>0){[pins[i-1],pins[i]]=[pins[i],pins[i-1]];savePins()}}],['Open '+app.name,()=>open(app.id)]],event.clientX,event.clientY)}
function dock(){const node=$('#dock');const order=[...pins,...[...windows.keys()].filter(id=>id!=='library'&&!pins.includes(id))];const ids=new Set(order);for(const button of [...node.children])if(!ids.has(button.dataset.id)&&button.dataset.id!=='library')button.remove();for(const [index,id] of order.entries()){const app=apps.find(a=>a.id===id);if(!app)continue;let button=node.querySelector('[data-id="'+id+'"]');if(!button){button=document.createElement('button');button.dataset.id=id;icon(button,app);button.style.fontSize='30px';button.ariaLabel=app.name;button.draggable=true;button.onclick=()=>toggle(id);button.oncontextmenu=e=>pinMenu(app,e);button.ondragstart=()=>dragged=id;button.ondragover=e=>e.preventDefault();button.ondrop=e=>{e.preventDefault();const a=pins.indexOf(dragged),b=pins.indexOf(id);if(a>=0&&b>=0){pins.splice(a,1);pins.splice(b,0,dragged);savePins()}}}button.classList.toggle('running',windows.has(id));node.insertBefore(button,node.children[index]||null)}let library=node.querySelector('.library');if(!library){library=document.createElement('button');library.className='library';library.dataset.id='library';library.textContent='▦';library.ariaLabel='App Library';library.onclick=()=>toggle('library')}node.append(library);node.style.width=Math.min((order.length+1)*64+10,innerWidth-24)+'px'}
function focus(id){active=id;const w=windows.get(id);if(!w)return;w.classList.remove('minimized');w.style.zIndex=++z;$('#active').textContent=id==='library'?'App Library':apps.find(a=>a.id===id)?.name||id}
function minimize(id){windows.get(id)?.classList.add('minimized');if(active===id){active=null;$('#active').textContent='Desktop'}}
function toggle(id){const w=windows.get(id);if(!w)return open(id);if(active===id&&!w.classList.contains('minimized'))minimize(id);else focus(id)}
function open(id){closeMenu();if(windows.has(id)){focus(id);return}const app=apps.find(a=>a.id===id)||{name:'App Library'};const w=document.createElement('section');w.className='window';w.dataset.app=id;w.style.left=(10+windows.size*3)%35+'%';const title=document.createElement('div');title.className='title';for(const [kind,action] of [['close',()=>{w.remove();windows.delete(id);active=null;$('#active').textContent='Desktop';dock()}],['min',()=>minimize(id)],['max',()=>w.classList.toggle('maximized')]]){const b=document.createElement('button');b.className='dot '+kind;b.ariaLabel=kind;b.onclick=action;title.append(b)}const caption=document.createElement('strong');caption.textContent=app.name;title.append(caption);w.append(title);const body=document.createElement('div');body.className='body';w.append(body);w.onpointerdown=()=>focus(id);let drag=null;title.onpointerdown=e=>{if(e.target.closest('button')||w.classList.contains('maximized'))return;drag={x:e.clientX,y:e.clientY,left:w.offsetLeft,top:w.offsetTop};title.setPointerCapture(e.pointerId)};title.onpointermove=e=>{if(drag){w.style.left=drag.left+e.clientX-drag.x+'px';w.style.top=Math.max(32,drag.top+e.clientY-drag.y)+'px'}};title.onpointerup=()=>drag=null;
 if(id==='library'||id==='store'){const search=document.createElement('input');search.placeholder='Search apps';search.ariaLabel='Search apps';body.append(search);const grid=document.createElement('div');grid.className='grid';body.append(grid);const render=()=>{grid.replaceChildren();for(const a of apps.filter(a=>a.name.toLowerCase().includes(search.value.toLowerCase()))){const b=document.createElement('button');icon(b,a);const label=document.createElement('span');label.textContent=a.name;b.append(label);b.onclick=()=>id==='store'?notify('Install '+a.name+' from the real Sovel Store; this browser test does not install apps.'):open(a.id);b.oncontextmenu=e=>pinMenu(a,e);grid.append(b)}};search.oninput=render;render()}
 else if(id==='settings'||id==='waypaper'){const heading=document.createElement('h1');heading.textContent='Background';body.append(heading);const b=document.createElement('button');b.textContent='Choose Image…';b.onclick=()=>$('#wallpaper').click();body.append(b);const p=document.createElement('p');p.textContent='External wallpaper tools: Waypaper + mpvpaper for Sovel, Hidamari for optional GNOME. 日本語 · 中文 · 한국어 · العربية · हिन्दी · Русский · 😀';body.append(p)}
 else{const h=document.createElement('h1');h.textContent=app.name;body.append(h);const p=document.createElement('p');p.textContent='Move this window beneath the top bar or dock: browser backdrop blur samples this window in real time. Minimize and reopen to retain the text below.';body.append(p);const input=document.createElement('textarea');input.ariaLabel='Window state test';input.placeholder='Type here, minimize, then restore this same window.';body.append(input);w.style.background=id==='com.brave.Browser'?'#bd4226ec':id==='com.spotify.Client'?'#12623fec':'#281d3fe6'}
 $('#windows').append(w);windows.set(id,w);focus(id);dock()}
const menus={system:[['About Sovel',()=>notify('Sovel browser interaction test')],['Settings',()=>open('settings')],['App Library',()=>open('library')]],file:[['Files',()=>open('files')]],view:[['App Library',()=>open('library')],['Screenshot',()=>selection()]],window:[['Minimize',()=>active&&minimize(active)],['Maximize / Restore',()=>active&&windows.get(active).classList.toggle('maximized')]]};
for(const button of document.querySelectorAll('[data-menu]'))button.onclick=()=>{const box=button.getBoundingClientRect();menu(button.dataset.menu,menus[button.dataset.menu],box.left,32)};
function jared(){if(menuOwner==='jared')return;const b=$('#jared').getBoundingClientRect();menu('jared',[['JARED status',()=>notify('No local JARED service is connected.')]],b.left,32)}$('#jared').onmouseenter=jared;$('#jared').onclick=jared;
$('#bar').oncontextmenu=e=>{e.preventDefault();menu('bar',menus.system,e.clientX,e.clientY)};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#menu')&&!e.target.closest('[data-menu]')&&!e.target.closest('#jared'))closeMenu()});window.onblur=closeMenu;document.onkeydown=e=>{if(e.key==='Escape'){closeMenu();$('#selection').style.display='none'}if((e.metaKey||e.key==='Meta'||e.getModifierState('OS'))&&e.shiftKey&&e.key.toLowerCase()==='s'){e.preventDefault();selection()}};
$('#wallpaper').onchange=e=>{const file=e.target.files[0];if(!file)return;const url=URL.createObjectURL(file),image=new Image();image.onload=()=>{if(wallpaperURL)URL.revokeObjectURL(wallpaperURL);wallpaperURL=url;document.body.style.backgroundImage='url("'+url+'")';notify('Background changed')};image.onerror=()=>{URL.revokeObjectURL(url);notify('That file is not a supported image.')};image.src=url};
function selection(){closeMenu();$('#selection').style.display='block'}$('#shot').onclick=selection;let start=null;$('#selection').onpointerdown=e=>{start=[e.clientX,e.clientY];$('#region').style.display='block';e.currentTarget.setPointerCapture(e.pointerId)};$('#selection').onpointermove=e=>{if(!start)return;Object.assign($('#region').style,{left:Math.min(start[0],e.clientX)+'px',top:Math.min(start[1],e.clientY)+'px',width:Math.abs(e.clientX-start[0])+'px',height:Math.abs(e.clientY-start[1])+'px'})};$('#selection').onpointerup=()=>{start=null;$('#selection').style.display='none';$('#region').style.display='none';notify('Selection UI tested. The OS shortcut captures, saves and copies actual pixels.')};
setInterval(()=>$('#clock').textContent=new Date().toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}),1000);dock();window.sovelTest={open,toggle,minimize,closeMenu,menu,windows,get pins(){return pins}};
</script></html>
