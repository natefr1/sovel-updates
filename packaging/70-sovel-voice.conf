# Match voice clients only; do not force the global clock or other apps' latency.
pulse.rules = [
 {
  matches = [
   { application.process.binary = "~(Discord|discord|vesktop|Vesktop)" }
   { application.name = "~(Discord|discord|vesktop|Vesktop)" }
  ]
  actions = { update-props = {
   pulse.min.req = 1024/48000
   pulse.min.quantum = 1024/48000
  } }
 }
]
